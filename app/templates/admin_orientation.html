<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deeksharambh Admin — JAIN University</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .card   { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(15,23,42,.04) }
  .h-card { font-size:15px; font-weight:700; color:#0f172a }
  .sub    { font-size:12px; color:#64748b; margin-top:2px }
  .stat   { background:#fff; border:1px solid #e2e8f0; border-left-width:4px; border-radius:12px; padding:14px }
  .stat b { display:block; font-size:22px; font-weight:800 }
  .stat s { display:block; font-size:11px; color:#64748b; margin-top:4px; text-decoration:none }
  .badge  { display:inline-flex; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600 }
  .b-blue { background:#dbeafe; color:#1e40af } .b-gray { background:#f1f5f9; color:#475569 }
  .btn    { font-size:12px; font-weight:700; border-radius:8px; padding:7px 12px; cursor:pointer; border:none; transition:.15s }
  .btn-soft { background:#f1f5f9; color:#334155 } .btn-soft:hover { background:#e2e8f0 }
  .btn-primary { background:#2563eb; color:#fff } .btn-primary:hover { background:#1d4ed8 }
  .btn-rose { background:#e11d48; color:#fff } .btn-rose:hover { background:#be123c }
  .field  { width:100%; padding:8px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:12px; background:#fff; outline:none }
  .link   { font-family:ui-monospace,Menlo,monospace; font-size:11px }
  th { padding:10px 12px; text-align:left; white-space:nowrap } td { padding:10px 12px; vertical-align:top }
</style>
</head>
<body class="h-full text-slate-800 antialiased">

<header class="bg-slate-900 text-white px-5 py-3 flex items-center gap-3">
  <div class="bg-white p-1.5 rounded-lg"><img src="/static/logo.png" alt="JAIN" class="h-7 w-auto" onerror="this.src='/static/logosmall.png'"></div>
  <div class="mr-auto">
    <div class="font-extrabold text-sm">JAIN <span class="text-amber-400">UNIVERSITY</span></div>
    <div class="text-[10px] text-slate-400">Deeksharambh Orientation Admin</div>
  </div>
  <a href="/admin/orientation/logout" class="btn btn-rose">Sign out</a>
</header>

<main class="max-w-5xl mx-auto p-5 space-y-5">

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div class="stat border-l-teal-600"><b id="st-count" class="text-teal-600">—</b><s>Responses</s></div>
    <div class="stat border-l-blue-600"><b id="st-depts" class="text-blue-600">—</b><s>Departments</s></div>
    <div class="stat border-l-slate-400"><b id="st-flag" class="text-sm pt-1.5">…</b><s>Form status</s></div>
  </div>

  <div class="card space-y-4">
    <div class="flex items-center justify-between gap-4">
      <div>
        <div class="h-card">🎓 Deeksharambh orientation form</div>
        <div class="sub">When off, students who open the form see a "not available" message.</div>
      </div>
      <input type="checkbox" id="tog-ori" onchange="toggleFlag(this.checked)" class="w-5 h-5 rounded accent-emerald-600 cursor-pointer">
    </div>
    <div class="flex items-center gap-2 border-t border-slate-100 pt-4">
      <span class="text-xs font-semibold text-slate-700 shrink-0">Student link</span>
      <input id="ori-url" readonly class="field link flex-1">
      <button class="btn btn-soft" onclick="copyUrl()">Copy</button>
      <a id="ori-open" href="/deeksharambh" target="_blank" class="btn btn-primary">Open</a>
    </div>
  </div>

  <div class="card space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div><div class="h-card">📋 Responses</div><div class="sub">Everything students submitted in the orientation form.</div></div>
      <input id="search" oninput="render()" class="field sm:w-64" placeholder="🔍 Search name, email, department…">
    </div>
    <div id="table"></div>
  </div>

</main>

<script>
const $ = id => document.getElementById(id);
const e = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let responses = [];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error('Request failed (' + r.status + ')');
  return r.json();
}

async function loadFlags() {
  try {
    const f = await api('/admin/api/flags');
    $('tog-ori').checked = !!f.orientation_enabled;
    $('st-flag').innerHTML = f.orientation_enabled
      ? '<span class="text-emerald-600 font-bold text-sm">🟢 Open</span>'
      : '<span class="text-rose-600 font-bold text-sm">🔴 Closed</span>';
  } catch (err) { console.error(err); }
}

async function toggleFlag(value) {
  try {
    await api('/admin/api/flags', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orientation_enabled: value }),
    });
  } catch (err) { alert('Could not update the setting.'); }
  loadFlags();
}

async function loadResponses() {
  $('table').innerHTML = '<div class="text-center p-8 text-slate-400 text-xs">Loading responses…</div>';
  try {
    responses = await api('/admin/api/orientation/responses');
    $('st-count').textContent = responses.length;
    $('st-depts').textContent = new Set(responses.map(r => r.program || '—')).size;
    render();
  } catch (err) {
    $('table').innerHTML = '<div class="text-center p-8 text-rose-500 text-xs">Could not load responses</div>';
  }
}

function answers(data) {
  const entries = Object.entries(data || {}).filter(([, v]) => v !== '' && v !== null && v !== undefined);
  if (!entries.length) return '<span class="text-slate-400">—</span>';
  return `<details><summary class="cursor-pointer text-blue-600 font-semibold">${entries.length} answers</summary>
    <div class="mt-2 space-y-1 text-[11px] max-w-lg">${entries.map(([k, v]) =>
      `<div><b class="text-slate-600">${e(k)}:</b> ${e(Array.isArray(v) ? v.join(', ') : v)}</div>`).join('')}</div></details>`;
}

function render() {
  const q = ($('search').value || '').toLowerCase();
  const rows = responses.filter(r =>
    [r.name, r.email, r.program].some(v => (v || '').toLowerCase().includes(q)));

  const head = ['#', 'Student', 'Level', 'Department', 'Submitted', 'Answers']
    .map(c => `<th>${c}</th>`).join('');
  const body = rows.length ? rows.map((r, i) => `
    <tr class="hover:bg-slate-50">
      <td>${i + 1}</td>
      <td><div class="font-semibold text-slate-900">${e(r.name)}</div><div class="text-[11px] text-slate-500 link">${e(r.email)}</div></td>
      <td><span class="badge b-gray">${(r.ug_or_pg || 'ug').toUpperCase()}</span></td>
      <td>${e(r.program || '—')}</td>
      <td><span class="text-slate-500 text-[11px]">${e(r.submitted_at || '—')}</span></td>
      <td>${answers(r.data)}</td>
    </tr>`).join('')
    : '<tr><td colspan="6" class="text-center p-8 text-slate-400">No responses yet</td></tr>';

  $('table').innerHTML =
    `<div class="overflow-x-auto"><table class="w-full text-xs border-collapse">
       <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">${head}</tr></thead>
       <tbody class="divide-y divide-slate-100">${body}</tbody></table></div>`;
}

function copyUrl() {
  navigator.clipboard.writeText($('ori-url').value);
}

$('ori-url').value = location.origin + '/deeksharambh';
loadFlags();
loadResponses();
</script>
</body>
</html>
